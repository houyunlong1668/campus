# SPA + 同源反代。七条代理路径必须与 frontend/vite.config.ts 的 dev 代理一致
# （改一边必须同步另一边——R8 的教训：S4 新端点漏配 dev 代理直接打红手测）。
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA history 模式（router 用 createWebHistory）：深链接回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源 API 反代 → compose 服务名 backend（单跑时用 --network 或改此文件挂载覆盖）
    location ~ ^/(api|chat|auth|health|debug|confirm|replay)(/|$) {
        proxy_pass              http://backend:8000;
        proxy_http_version      1.1;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 关键：/chat 是长事件流，nginx 默认缓冲会把 token 憋住不发
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }
}
