# CI/CD（2026-09-30 重设计）：
#   CI = 三门禁（pytest+契约 / vitest+类型 / k6 四门），跑 GitHub 托管 runner——
#        已验证又快又稳；k6 钉 v2.3.0 与本地同版本，uv 用 pip 装、k6 双下载源。
#   CD = 构建双镜像推阿里云 ACR，跑 **self-hosted runner（本机）**——
#        托管 runner（美西）→ 杭州 ACR 跨境链路三跑三败（run #3/#4 push 超时），
#        国内近源直推是结构性解法（同参考文档「内网加速」思路）。
#
# self-hosted runner 前提（一次性配置，见 CLAUDE.md CI/CD 段）：
#   仓库 Settings → Actions → Runners → New self-hosted runner（Windows x64）→
#   本机执行 config + run（或注册为服务）。runner 在线时 push 自动触发 CD；
#   离线则 deploy 排队显示 Waiting for a self-hosted runner——不阻塞 CI 门禁
#   （已取消 workflow 级 concurrency，门禁与部署互不锁死），上线或手动取消即可。
#   deploy 内置 WSL 唤醒步骤（dockerd 跑在 WSL 里、空闲会退出）。
#
# 必需的 GitHub Secrets：
#   ACR_USERNAME  阿里云登录用户名（参考文档为 houyunlong；建议改用 RAM 子账号）
#   ACR_PASSWORD  ACR 访问凭证密码（阿里云控制台「访问凭证」页设置，不是阿里云登录密码）
# 镜像仓库：registry.cn-hangzhou.aliyuncs.com/hou_yun_long/campus（须先在控制台创建该仓库）
#   tag 规则：push main → backend-sha-<7位> / frontend-sha-<7位>（另推 -latest）
#             push v* 标签 → backend-<vX.Y.Z> / frontend-<vX.Y.Z>

name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# 故意不设 workflow 级 concurrency：部署改 self-hosted 后，机器离线会让 deploy
# 长时间排队——workflow 级组会把后续 push 的整条流水线一起锁死。改为 deploy job
# 级 concurrency（deploy-acr 组 + cancel-in-progress），新 push 顶掉旧部署。

permissions:
  contents: read

jobs:
  backend-tests:
    name: 后端 pytest + 跨层契约
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv 并固定 Python 3.13（与本地开发一致）
        run: |
          python3 -m pip install --quiet uv
          uv python install 3.13

      - name: 装依赖（uv.lock 冻结，含 dev 组 pytest）
        working-directory: backend
        run: uv sync --frozen --python 3.13

      - name: 装 academic MCP 依赖（A1–A6 真子进程用例要 sqlglot——缺 academic/.venv
          时 stdio 解释器探针回落 backend venv，import 即挂到超时）
        working-directory: mcp_servers/academic
        run: uv sync --frozen --python 3.13

      - name: pytest（全跑 SQLite，不起子进程不打网络的单元层照旧）
        working-directory: backend
        env:
          DB_BACKEND: sqlite
        run: uv run --no-sync pytest -q

      - name: 跨层契约断言（PAGE_REGISTRY ↔ router ↔ /api/* ↔ 双方言迁移）
        env:
          DB_BACKEND: sqlite
        run: uv run --no-sync --project backend python scripts/check_routes_contract.py

  frontend-tests:
    name: 前端 vitest + vue-tsc 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: vitest 全量
        working-directory: frontend
        run: npx vitest run

      - name: 类型检查 + 生产构建（vue-tsc -b && vite build）
        working-directory: frontend
        run: npm run build

  k6-gate:
    name: k6 四门 HTTP 门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv 并固定 Python 3.13
        run: |
          python3 -m pip install --quiet uv
          uv python install 3.13

      - name: 装 backend 依赖（run_k6.sh 要起 seed + uvicorn）
        working-directory: backend
        run: uv sync --frozen --python 3.13

      - name: 装 academic MCP 依赖（uvicorn lifespan 拉 academic 子进程要 sqlglot——
          缺它 lifespan 起不来，/health 永远不就绪、门禁必红）
        working-directory: mcp_servers/academic
        run: uv sync --frozen --python 3.13

      - name: 安装 k6 v2.3.0（双下载源：GitHub tar.gz → Docker Hub 官方镜像）
        # run #1/#2 同步红的根因（官方 API 实锤）：linux 资产是 .tar.gz 不是 .zip，旧 URL 必 404，
        # 与网络无关。按「更换下载源」诉求加完全不经 GitHub 的备源：Docker Hub grafana/k6:2.3.0
        # （本机已实测：镜像存在、二进制在 /usr/bin/k6）。set -x 留全跟踪。
        run: |
          set -x
          mkdir -p /tmp/k6x
          K6BIN=""
          if curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 -o /tmp/k6.tgz \
              https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz \
              && tar -xzf /tmp/k6.tgz -C /tmp/k6x; then
            K6BIN="$(find /tmp/k6x -type f -name k6 | head -1)"
          fi
          if [ -z "$K6BIN" ]; then
            echo "::warning::GitHub 官方源未取到，切换备用下载源：Docker Hub grafana/k6:2.3.0"
            docker pull grafana/k6:2.3.0
            docker create --name k6extract grafana/k6:2.3.0
            docker cp k6extract:/usr/bin/k6 /tmp/k6x/k6
            docker rm k6extract
            K6BIN=/tmp/k6x/k6
          fi
          if [ ! -f "$K6BIN" ]; then
            echo "::error::两个下载源都没能提供 k6 二进制（GitHub tar.gz 与 Docker Hub）"
            exit 1
          fi
          sudo install "$K6BIN" /usr/local/bin/k6
          k6 version

      - name: 跑四门（authz / session_isolation / sse_chat / api_smoke）
        run: bash scripts/run_k6.sh

  deploy-image:
    name: 构建镜像并推送阿里云 ACR（self-hosted 国内直推）
    # self-hosted：跨太平洋推 ACR 三跑三败，改本机近源直推（详见文件头说明）
    runs-on: [self-hosted]
    # Windows self-hosted：脚本全是 bash 语法，默认 shell 是 pwsh 会直接语法爆炸
    defaults:
      run:
        shell: bash
    timeout-minutes: 35
    # 部署互斥且新的顶掉旧的：机器离线时排队、上线自动跑；连推两次不会堆两个部署
    concurrency:
      group: deploy-acr
      cancel-in-progress: true
    # PR 不发版；push main / v* 标签 / 手动触发才构建推送，且必须三门全绿
    needs: [backend-tests, frontend-tests, k6-gate]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      ACR_REGISTRY: registry.cn-hangzhou.aliyuncs.com
      ACR_IMAGE: registry.cn-hangzhou.aliyuncs.com/hou_yun_long/campus
    steps:
      # dockerd 跑在 WSL 里且空闲自动退出——每 job 开场先唤醒并等 docker TCP 就绪
      - name: 唤醒 WSL 并等 docker 就绪（仅 Windows runner）
        if: runner.os == 'Windows'
        run: |
          ts() { date -u +%H:%M:%S; }
          echo "[$(ts)] 唤醒 WSL Ubuntu..."
          wsl.exe -d Ubuntu -- echo wsl-ready || echo "::warning::WSL 唤醒返回非零，继续等 docker"
          for i in $(seq 1 45); do
            if docker ps >/dev/null 2>&1; then
              echo "[$(ts)] docker 就绪（第 ${i} 次探测）"
              break
            fi
            sleep 2
          done
          docker ps || { echo "::error::docker 始终不可达（WSL/dockerd/context 配置？）"; exit 1; }

      - uses: actions/checkout@v4

      - name: 解析镜像版本号（v* 标签用标签名，否则短 sha）
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "IMAGE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          fi

      # 先构建后登录：构建期不持有任何云凭据，凭据暴露窗口压到 push 一步
      - name: 构建 backend 镜像
        run: docker build -f backend/Dockerfile -t "campus:backend-$IMAGE_TAG" .

      - name: 构建 frontend 镜像
        run: docker build -f frontend/Dockerfile -t "campus:frontend-$IMAGE_TAG" .

      - name: 登录阿里云 ACR（参考文档步骤 1；密码走 password-stdin 不回显）
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::缺少 Secrets ACR_USERNAME / ACR_PASSWORD（阿里云 ACR 访问凭证，见 CLAUDE.md CI/CD 段）"
            exit 1
          fi
          echo "$ACR_PASSWORD" | docker login --username "$ACR_USERNAME" \
            --password-stdin "$ACR_REGISTRY"

      - name: 打标并推送（参考文档步骤 3/5）
        # 本机国内直推（快）；仍保留两层保险：UTC 时间戳心跳（docker push 的 \r 进度
        # 在 Actions 里整段静默）+ 限时换连接重试（可移植写法——Git Bash 未必有 GNU timeout）。
        run: |
          ts() { date -u +%H:%M:%S; }
          push_timed() {
            local tag="$1" limit="${2:-480}"
            docker push "$tag" &
            local pid=$!
            ( sleep "$limit"; kill "$pid" 2>/dev/null ) &
            local wd=$!
            local rc=0
            wait "$pid" || rc=$?
            kill "$wd" 2>/dev/null || true
            wait "$wd" 2>/dev/null || true
            return $rc
          }
          push_try() {
            local tag="$1"
            for i in 1 2; do
              echo "[$(ts)] push $tag 第 $i 次开始"
              if push_timed "$tag" 480; then
                echo "[$(ts)] push $tag 成功"
                return 0
              else
                echo "::warning::push $tag 第 $i 次超时/失败，10s 后重试（已传层自动跳过）"
                sleep 10
              fi
            done
            echo "::error::push $tag 两轮均失败（ACR 凭据/仓库/网络皆可能）"
            return 1
          }
          docker tag "campus:backend-$IMAGE_TAG"  "$ACR_IMAGE:backend-$IMAGE_TAG"
          docker tag "campus:frontend-$IMAGE_TAG" "$ACR_IMAGE:frontend-$IMAGE_TAG"
          push_try "$ACR_IMAGE:backend-$IMAGE_TAG"
          push_try "$ACR_IMAGE:frontend-$IMAGE_TAG"
          # main 分支额外推 -latest，便于 ECS/服务器按固定名拉取（层已在仓库，只推 manifest）
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "campus:backend-$IMAGE_TAG"  "$ACR_IMAGE:backend-latest"
            docker tag "campus:frontend-$IMAGE_TAG" "$ACR_IMAGE:frontend-latest"
            push_try "$ACR_IMAGE:backend-latest"
            push_try "$ACR_IMAGE:frontend-latest"
          fi
          docker images "$ACR_IMAGE" || true
