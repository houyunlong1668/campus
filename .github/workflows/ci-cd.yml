# CI：测试三层门禁（pytest+契约 / vitest+类型 / k6 四门），跑 GitHub 托管 runner。
# CD（构建双镜像推阿里云 ACR）已迁至云效 Flow——见 docs/yunxiao-cicd.md：
#    托管 runner 跨境推 ACR 三跑三败（run #3/#4）后弃用，代码源 Codeup、近源直推。
# 本文件只留门禁：日常裸 push 上游是 codeup（触发云效），只有显式 push github 才跑这里。
#
# k6 钉 v2.3.0 与本地同版本（双下载源 GitHub tar.gz → Docker Hub 备胎）；
# 未用第三方 setup action（setup-uv/setup-k6）：uv 走 pip、k6 直下，防 action 主版本失效。

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read

jobs:
  backend-tests:
    name: 后端 pytest + 跨层契约
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv 并固定 Python 3.13（与本地开发一致）
        run: |
          python3 -m pip install --quiet uv
          uv python install 3.13

      - name: 装依赖（uv.lock 冻结，含 dev 组 pytest）
        working-directory: backend
        run: uv sync --frozen --python 3.13

      - name: 装 academic MCP 依赖（A1–A6 真子进程用例要 sqlglot——缺 academic/.venv
          时 stdio 解释器探针回落 backend venv，import 即挂到超时）
        working-directory: mcp_servers/academic
        run: uv sync --frozen --python 3.13

      - name: pytest（全跑 SQLite，不起子进程不打网络的单元层照旧）
        working-directory: backend
        env:
          DB_BACKEND: sqlite
        run: uv run --no-sync pytest -q

      - name: 跨层契约断言（PAGE_REGISTRY ↔ router ↔ /api/* ↔ 双方言迁移）
        env:
          DB_BACKEND: sqlite
        run: uv run --no-sync --project backend python scripts/check_routes_contract.py

  frontend-tests:
    name: 前端 vitest + vue-tsc 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: vitest 全量
        working-directory: frontend
        run: npx vitest run

      - name: 类型检查 + 生产构建（vue-tsc -b && vite build）
        working-directory: frontend
        run: npm run build

  k6-gate:
    name: k6 四门 HTTP 门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv 并固定 Python 3.13
        run: |
          python3 -m pip install --quiet uv
          uv python install 3.13

      - name: 装 backend 依赖（run_k6.sh 要起 seed + uvicorn）
        working-directory: backend
        run: uv sync --frozen --python 3.13

      - name: 装 academic MCP 依赖（uvicorn lifespan 拉 academic 子进程要 sqlglot——
          缺它 lifespan 起不来，/health 永远不就绪、门禁必红）
        working-directory: mcp_servers/academic
        run: uv sync --frozen --python 3.13

      - name: 安装 k6 v2.3.0（双下载源：GitHub tar.gz → Docker Hub 官方镜像）
        # run #1/#2 同步红的根因（官方 API 实锤）：linux 资产是 .tar.gz 不是 .zip，旧 URL 必 404，
        # 与网络无关。按「更换下载源」诉求加完全不经 GitHub 的备源：Docker Hub grafana/k6:2.3.0
        # （本机已实测：镜像存在、二进制在 /usr/bin/k6）。set -x 留全跟踪。
        run: |
          set -x
          mkdir -p /tmp/k6x
          K6BIN=""
          if curl -fsSL --retry 3 --retry-delay 2 --connect-timeout 15 -o /tmp/k6.tgz \
              https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz \
              && tar -xzf /tmp/k6.tgz -C /tmp/k6x; then
            K6BIN="$(find /tmp/k6x -type f -name k6 | head -1)"
          fi
          if [ -z "$K6BIN" ]; then
            echo "::warning::GitHub 官方源未取到，切换备用下载源：Docker Hub grafana/k6:2.3.0"
            docker pull grafana/k6:2.3.0
            docker create --name k6extract grafana/k6:2.3.0
            docker cp k6extract:/usr/bin/k6 /tmp/k6x/k6
            docker rm k6extract
            K6BIN=/tmp/k6x/k6
          fi
          if [ ! -f "$K6BIN" ]; then
            echo "::error::两个下载源都没能提供 k6 二进制（GitHub tar.gz 与 Docker Hub）"
            exit 1
          fi
          sudo install "$K6BIN" /usr/local/bin/k6
          k6 version

      - name: 跑四门（authz / session_isolation / sse_chat / api_smoke）
        run: bash scripts/run_k6.sh

